# 테스트 전용 설정 — MySQL 대신 MySQL 호환 모드의 인메모리 H2를 쓴다.
# Flyway 마이그레이션은 운영과 같은 파일을 그대로 돌린다.
spring:
  datasource:
    url: jdbc:h2:mem:jinsangstop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

# 테스트에서는 세션 시작 시 캐시 예열을 끈다(추론 서비스는 모의 객체)
jinsangstop:
  acting:
    warmup-enabled: false
  scoring:
    warmup-enabled: false
    # 테스트에서는 모의 채점이 곧바로 끝나므로 넉넉히 기다려 응답에 점수가 실리게 한다
    response-wait: 5s
