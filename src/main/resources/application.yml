# 「진상 멈춰」 백엔드 기본 설정
# 주소·계정은 환경변수로 주입한다. 기본값은 compose.yaml의 로컬 개발용 MySQL에 맞춰 두었다.
spring:
  application:
    name: jinsang-stop-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jinsangstop?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:jinsangstop}
    password: ${DB_PASSWORD:jinsangstop-local}
  jpa:
    # 스키마는 Flyway가 만든다. JPA는 엔티티와 테이블이 맞는지 검증만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 업로드를 multipart로 받지 않는다 — multipart는 큰 파일을 임시 파일로 디스크에 쓴다(ADR-0006)
  servlet:
    multipart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  # 로그인 세션(ADR-0010) — 서버 메모리 세션, HttpOnly + SameSite=Lax 쿠키
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:1d}
      cookie:
        http-only: true
        same-site: lax

# 프론트엔드 개발 서버 주소. 여러 개면 쉼표로 구분한다.
jinsangstop:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 음성 서비스(파이썬) — 127.0.0.1에만 바인딩돼 있고 백엔드만 호출한다(ADR-0008)
  voice:
    base-url: ${VOICE_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout: ${VOICE_CONNECT_TIMEOUT:2s}
    health-timeout: ${VOICE_HEALTH_TIMEOUT:3s}
    transcribe-timeout: ${VOICE_TRANSCRIBE_TIMEOUT:60s}
  # 추론 서비스(llama-server, OpenAI 호환) — 127.0.0.1에만 바인딩돼 있고 백엔드만 호출한다(ADR-0009)
  inference:
    base-url: ${INFERENCE_SERVICE_URL:http://127.0.0.1:8081}
    connect-timeout: ${INFERENCE_CONNECT_TIMEOUT:2s}
    health-timeout: ${INFERENCE_HEALTH_TIMEOUT:3s}
    completion-timeout: ${INFERENCE_COMPLETION_TIMEOUT:60s}
  # 민원인 연기 호출 — temperature는 0보다 크게, 시드는 세션마다 기록(ADR-0009)
  acting:
    temperature: ${ACTING_TEMPERATURE:0.8}
    max-tokens: ${ACTING_MAX_TOKENS:200}
    warmup-enabled: ${ACTING_WARMUP_ENABLED:true}
  # 태도 3축 채점 — 슬롯 1, temperature 0, 고정 시드(ADR-0009)
  scoring:
    seed: ${SCORING_SEED:42}
    max-tokens: ${SCORING_MAX_TOKENS:300}
    # PARALLEL: 연기와 동시에 / SEQUENTIAL: 연기 응답 직후(합성 구간과 겹치게)
    mode: ${SCORING_MODE:PARALLEL}
    # 합성이 끝난 뒤 채점 결과를 턴 응답에 싣기 위해 더 기다리는 최대 시간. 넘으면 PENDING으로 응답하고 나중에 저장
    response-wait: ${SCORING_RESPONSE_WAIT:1s}
    warmup-enabled: ${SCORING_WARMUP_ENABLED:true}
  # 절대선 문서 — 출력 검사의 금칙 목록(ADR-0005)
  safety:
    absolute-lines: ${ABSOLUTE_LINES_DOCUMENT:classpath:safety/absolute-lines.txt}
  # 성장 기록 편입 — 경계 설정 하한선(1~5). 비워 두면 모든 세션이 "편입 보류"다. 파일럿 데이터로 정한다(ADR-0004)
  growth:
    boundary-threshold: ${GROWTH_BOUNDARY_THRESHOLD:}
  training:
    # 마지막 활동 뒤로 이 시간 동안 아무것도 없으면 방치된 세션으로 보고 다음 시작 요청 때 정리한다
    idle-timeout: ${TRAINING_IDLE_TIMEOUT:10m}
    # 발화 턴 오디오 최대 크기 — 음성 서비스 기본 상한(25MB)과 맞춘다
    max-audio-bytes: ${TRAINING_MAX_AUDIO_BYTES:26214400}

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs
